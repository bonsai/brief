name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # deno task verify = lint && check && test && schema --check
  # PowerShell 版はリポジトリ外（Documents/PowerShell）にあるためここでは回せない。
  # 統合するまでは #16 を参照。
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          version: v2.x

      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.cache/deno/npm
            ~/.cache/deno/remote
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: lint / check / test / schema drift
        run: deno task verify